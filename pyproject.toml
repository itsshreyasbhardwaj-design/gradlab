[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gradlab"
version = "0.1.0"
description = "An educational machine learning framework with a from-scratch reverse-mode autodiff engine."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Shreyas Bhardwaj" }]
keywords = ["autograd", "automatic-differentiation", "machine-learning", "education", "neural-networks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]
# PyTorch is used ONLY as an independent test oracle in tests/conformance.
# It is never imported by src/gradlab. See docs/validation.md.
oracle = ["torch>=2.2"]

[project.urls]
Homepage = "https://github.com/itsshreyasbhardwaj-design/gradlab"
Documentation = "https://github.com/itsshreyasbhardwaj-design/gradlab/tree/main/docs"
Issues = "https://github.com/itsshreyasbhardwaj-design/gradlab/issues"

[project.scripts]
gradlab-microscope = "gradlab.inspection.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gradlab"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/gradlab"]
# --doctest-modules runs every example in a docstring. The docs make a lot of
# concrete numerical claims; this is what keeps them from drifting.
addopts = "-q --strict-markers --doctest-modules"
markers = [
  "oracle: requires PyTorch as an independent reference implementation",
  "slow: longer-running integration or training test",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "NPY"]
# RUF001-003: Greek letters and typographic minus signs are deliberate
# mathematical notation throughout the docstrings, not homoglyph mistakes.
ignore = ["E741", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["gradlab"]
# examples/ import a sibling helper module by bare name when run as scripts.
known-local-folder = ["_report"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# The examples and benchmarks are scripts meant to be read top to bottom; a few
# long f-strings there are clearer on one line than wrapped.
"examples/**" = ["E501"]
"benchmarks/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/gradlab"]
warn_unused_configs = true
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["src/gradlab"]
branch = true
