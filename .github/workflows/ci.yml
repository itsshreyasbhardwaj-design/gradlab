name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install (with the PyTorch oracle)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Torch is only a test oracle. CPU wheels keep CI fast, and a failure
          # here must not fail the build: the conformance tests skip cleanly
          # without it, and a skip is reported as a skip, never as a pass.
          pip install torch --index-url https://download.pytorch.org/whl/cpu || \
            echo "::warning::PyTorch unavailable; conformance tests will SKIP"

      - name: Lint
        run: ruff check src tests examples benchmarks

      - name: Format check
        run: ruff format --check src tests examples

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q --cov=gradlab --cov-report=xml --cov-report=term

      - name: Fail if conformance tests were skipped on the primary version
        if: matrix.python == '3.12'
        run: |
          # The PyTorch comparison is a load-bearing correctness claim. On the
          # primary Python version its absence is a build failure, not a notice.
          pytest tests/conformance -q --no-header -rs 2>&1 | tee /tmp/conf.txt
          if grep -q "skipped" /tmp/conf.txt; then
            echo "::error::Conformance tests skipped — the PyTorch oracle did not install."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  verify-claims:
    name: verify documented numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Documentation claims must match the engine
        run: pytest tests/integration/test_documented_claims.py -q

      - name: Doctests
        run: pytest --doctest-modules src/gradlab -q

      - name: Every example must run
        run: |
          set -e
          for script in scalar_autograd linear_regression xor two_moons classification lessons; do
            echo "::group::examples/$script.py"
            python "examples/$script.py" > /dev/null
            echo "::endgroup::"
          done
          # digits.py must exit cleanly WITHOUT downloading anything.
          python examples/digits.py | grep -q "will not download anything unless you ask"

      - name: Microscope traces must generate and be self-consistent
        run: |
          python -m gradlab.inspection.cli generate --fast --out /tmp/traces
          python - <<'PY'
          import json, pathlib
          d = pathlib.Path("/tmp/traces")
          index = json.loads((d / "index.json").read_text())
          assert index["traces"], "index is empty"
          for entry in index["traces"]:
              path = d / entry["file"]
              assert path.exists(), f"index names a missing file: {entry['file']}"
              payload = json.loads(path.read_text())
              assert payload["schema_version"] == index["schema_version"]
          print(f"{len(index['traces'])} traces verified")
          PY

  build:
    name: package builds and installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - name: Install from the wheel into a clean environment and smoke test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python - <<'PY'
          import gradlab as gl
          x = gl.Tensor(3.0, requires_grad=True)
          y = x * x + 2 * x
          y.backward()
          assert y.item() == 15.0, y.item()
          assert x.grad.item() == 8.0, x.grad.item()
          print(f"clean install OK — gradlab {gl.__version__}")
          PY
          /tmp/clean/bin/gradlab-microscope trace "x^2 + 2*x" --at x=3 | grep -q "8.0"
